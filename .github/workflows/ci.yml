name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: legaltech_owner
          POSTGRES_PASSWORD: legaltech_owner_dev
          POSTGRES_DB: legaltech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U legaltech_owner -d legaltech"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      OWNER_PSQL_URL: postgresql://legaltech_owner:legaltech_owner_dev@localhost:5432/legaltech
      APP_PSQL_URL: postgresql://legaltech_app:legaltech_app_dev@localhost:5432/legaltech
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Environment file
        run: cp .env.example .env

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Docker Compose config
        run: docker compose -f infra/docker/docker-compose.yml config --quiet

      - name: Create application role
        run: psql "$OWNER_PSQL_URL" -v ON_ERROR_STOP=1 -f infra/docker/postgres/init/01-roles.sql

      - name: Prisma validate
        run: pnpm --filter @legaltech/database run validate

      - name: Prisma migrate deploy
        run: pnpm --filter @legaltech/database run migrate:deploy

      - name: Prisma schema drift check
        run: |
          set -a; . ./.env; set +a
          pnpm --filter @legaltech/database exec prisma migrate diff \
            --from-url "$DATABASE_MIGRATION_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

      - name: Verify audit_logs is append-only
        run: |
          psql "$APP_PSQL_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO audit_logs (action) VALUES ('ci.check');"
          if psql "$APP_PSQL_URL" -v ON_ERROR_STOP=1 -c "UPDATE audit_logs SET action = 'x';"; then
            echo "UPDATE on audit_logs must fail for the application role"; exit 1
          fi
          if psql "$APP_PSQL_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM audit_logs;"; then
            echo "DELETE on audit_logs must fail for the application role"; exit 1
          fi
          if psql "$OWNER_PSQL_URL" -v ON_ERROR_STOP=1 -c "UPDATE audit_logs SET action = 'x';"; then
            echo "UPDATE on audit_logs must fail for the owner role (trigger)"; exit 1
          fi

      # S3-compatible storage for the document storage integration tests (SeaweedFS, as in
      # development). Started as a step because a service container cannot take a command.
      - name: Start S3-compatible storage (SeaweedFS)
        run: |
          docker run -d --name seaweedfs -p 127.0.0.1:8333:8333 \
            -e AWS_ACCESS_KEY_ID=legaltech_ci -e AWS_SECRET_ACCESS_KEY=legaltech_ci_secret \
            chrislusf/seaweedfs:4.47 server -s3 -dir=/data -ip.bind=0.0.0.0
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8333/ || true)
            [ "$code" = "403" ] && exit 0
            sleep 1
          done
          docker logs seaweedfs; exit 1

      # PrismaAuthRepository and the other repositories against the migrated database, as the
      # application role (runtime privileges), and S3StorageProvider against SeaweedFS. The
      # tests skip themselves without their variables, so fail here rather than let an empty
      # value pass silently.
      - name: Integration tests (PostgreSQL and S3)
        env:
          INTEGRATION_DATABASE_URL: ${{ env.APP_PSQL_URL }}
          INTEGRATION_S3_ENDPOINT: http://127.0.0.1:8333
          INTEGRATION_S3_ACCESS_KEY_ID: legaltech_ci
          INTEGRATION_S3_SECRET_ACCESS_KEY: legaltech_ci_secret
        run: |
          test -n "$INTEGRATION_DATABASE_URL" || { echo "INTEGRATION_DATABASE_URL is empty"; exit 1; }
          test -n "$INTEGRATION_S3_ENDPOINT" || { echo "INTEGRATION_S3_ENDPOINT is empty"; exit 1; }
          pnpm --filter @legaltech/api run test:integration
