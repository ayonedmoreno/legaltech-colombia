# Local development infrastructure. Development-only credentials.
name: legaltech

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: legaltech_owner
      POSTGRES_PASSWORD: legaltech_owner_dev
      POSTGRES_DB: legaltech
    ports:
      # Bound to localhost only: the database is never exposed on the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legaltech_owner -d legaltech"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for development (ADR-001 point 8; SeaweedFS, Apache-2.0).
  # Buckets are private: requests need these development credentials or a presigned URL.
  # Production storage (provider and region) is decision P3.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    restart: unless-stopped
    command: ["server", "-s3", "-dir=/data", "-ip.bind=0.0.0.0"]
    environment:
      AWS_ACCESS_KEY_ID: legaltech_dev
      AWS_SECRET_ACCESS_KEY: legaltech_dev_secret
    ports:
      # S3 API, bound to localhost only.
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs_data:/data

  # Antivirus for the document treatment (Phase 3; the worker streams each file to clamd).
  # Pinned by digest: the tag is rebuilt daily with new signatures. Signature updates are off
  # (CLAMAV_NO_FRESHCLAMD) so development and CI use the signatures baked into this image, with
  # no network dependency; production must keep them updated (SECURITY_SPEC.md §12).
  clamav:
    image: clamav/clamav:1.5.4@sha256:ebec5bc138401b36ae987caa1a3fa3c3b2a21ed3d51f0bfa5852825e663e67b0
    restart: unless-stopped
    environment:
      CLAMAV_NO_FRESHCLAMD: "true"
    ports:
      # clamd, bound to localhost only.
      - "127.0.0.1:3310:3310"
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

volumes:
  postgres_data:
  seaweedfs_data:
